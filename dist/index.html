ice Integration"],benefits:["Drastic reduction in electricity bills","Hedge against rising energy costs","Enhanced corporate sustainability profile","Minimal disruption during installation"]},{id:3,title:"Battery Energy Storage System",description:"Advanced energy storage solutions ensuring reliable power supply and grid stability around the clock.",longDescription:"Mitigate intermittency and ensure uninterrupted power supply with our advanced Battery Energy Storage Systems (BESS). Designed to store excess solar energy for use during peak demand or grid outages, our BESS solutions offer peak shaving, load leveling, and essential backup power.",image:"https://images.unsplash.com/photo-1592833159155-c62df1b65634?auto=format&fit=crop&q=80&w=1200",features:["Lithium-Ion & Advanced Flow Batteries","Intelligent Battery Management System (BMS)","Seamless Off-Grid Transitioning","Scalable Containerized Solutions"],benefits:["Energy independence during grid failures","Avoidance of peak demand charges","Maximized solar self-consumption","Extended equipment lifespan via stable voltage"]},{id:4,title:"Residential PV Solution",description:"Tailored solar power systems for homes, bringing sustainable and independent energy to your household.",longDescription:"Empower your home with clean, renewable energy. Our Residential PV Solutions are aesthetically designed, highly efficient, and integrated with smart home technologies. Enjoy significant savings on your utility bills while contributing to a sustainable future.",image:"https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&q=80&w=1200",features:["Aesthetic & Low-Profile Solar Panels","Hybrid Inverters with Battery Compatibility","Mobile App for Energy Monitoring","Weather-Resistant Mounting Hardware"],benefits:["Lower monthly electricity bills","Increased property value","Protection against power outages","Simple, hassle-free maintenance"]},{id:5,title:"Solar Irrigation System",description:"Eco-friendly solar-powered pumps and irrigation setups to support sustainable agricultural practices.",longDescription:"Revolutionize agricultural water management with our Solar Irrigation Systems. Designed to replace expensive diesel pumps, these systems provide a reliable, maintenance-free, and zero-emission water supply for crops, ensuring food security and higher profit margins for farmers.",image:"https://media.istockphoto.com/id/1322433940/photo/solar-panels-which-can-run-submerge-water-pump-for-irrigation-and-distribution-of-water-in.jpg?s=612x612&w=0&k=20&c=ARL_MdUeMQ06smgbYUnlDDRa3mq3txPxvrX6JFp7ov4=",features:["High-Efficiency Submersible & Surface Pumps","Variable Frequency Drive (VFD) Controllers","Dry-Run Protection Sensors","Durable, Rust-Proof Mounting Structures"],benefits:["Elimination of fuel costs","Quiet and clean operation","Low maintenance requirements","Consistent water delivery during sunlight hours"]},{id:6,title:"Floating Solar PV System",description:"Innovative solar installations on water bodies, saving land space and increasing panel efficiency through natural cooling.",longDescription:"Maximize energy generation without utilizing valuable land. Our Floating Solar PV Systems are installed on lakes, reservoirs, and industrial ponds. The natural cooling effect of the water increases panel efficiency, while the panels reduce water evaporation—a perfect synergy of resource conservation.",image:"https://media.istockphoto.com/id/2244092029/photo/drone-view-of-floating-solar-panel-solar-photovoltaic-panel-pv-system-in-industry-lake-water.jpg?s=612x612&w=0&k=20&c=H3hF5HaAGXnub8SPTKCrIEW3YSIaZ_qP54FAOvmPxu8=",features:["High-Density Polyethylene (HDPE) Floats","Mooring & Anchoring Engineering","Marine-Grade Cable Management","Enhanced Yield via Water Cooling"],benefits:["Preservation of terrestrial land","Increased energy output by up to 10%","Reduction of algae growth in water bodies","Environmentally symbiotic design"]},{id:7,title:"Building Integrated
